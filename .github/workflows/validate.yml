name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate portable package
        run: python -B skills/embedded-yzscodesys/scripts/package_skill.py check
      - name: Run tooling and native C/C++ tests
        run: python -B -m unittest discover -s skills/embedded-yzscodesys/tests -v
